syntax = "proto3";

package iam;
option go_package = "./api/iam";

import "common.proto";

// ---------- 认证 ----------
message LoginRequest {
  string username = 1;
  string password = 2;
  string tenant_id = 3;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  User user = 4;
}

message RefreshRequest {
  string refresh_token = 1;
}

message VerifyRequest {
  string token = 1;
}

message VerifyResponse {
  bool valid = 1;
  int64 user_id = 2;
  string username = 3;
  string tenant_id = 4;
  repeated string roles = 5;
  repeated string permissions = 6;
  string org_path = 7;
}

// ---------- 用户 ----------
message User {
  int64 id = 1;
  string tenant_id = 2;
  string username = 3;
  string real_name = 4;
  string email = 5;
  string phone = 6;
  int64 org_id = 7;
  string org_path = 8;
  int32 status = 9;
  int64 created_at = 10;
}

message CreateUserRequest {
  string tenant_id = 1;
  string username = 2;
  string password = 3;
  string real_name = 4;
  string email = 5;
  string phone = 6;
  int64 org_id = 7;
  repeated int64 role_ids = 8;
}

message UpdateUserRequest {
  int64 id = 1;
  string tenant_id = 2;
  string real_name = 3;
  string email = 4;
  string phone = 5;
  int64 org_id = 6;
  int32 status = 7;
  repeated int64 role_ids = 8;
}

message ListUsersRequest {
  string tenant_id = 1;
  string keyword = 2;
  PageRequest page = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  PageResponse page = 2;
}

// ---------- 角色 ----------
message Role {
  int64 id = 1;
  string tenant_id = 2;
  string role_code = 3;
  string role_name = 4;
  string description = 5;
  string data_scope = 6;  // self/dept/dept_and_sub/all
  int32 status = 7;
  int64 created_at = 8;
}

message CreateRoleRequest {
  string tenant_id = 1;
  string role_code = 2;
  string role_name = 3;
  string description = 4;
  string data_scope = 5;
}

message ListRolesRequest {
  string tenant_id = 1;
  PageRequest page = 2;
}

message ListRolesResponse {
  repeated Role roles = 1;
  PageResponse page = 2;
}

// ---------- 权限 ----------
message Permission {
  int64 id = 1;
  string tenant_id = 2;
  string perm_code = 3;
  string perm_name = 4;
  int32 perm_type = 5;  // 1=菜单 2=按钮 3=接口
  string path = 6;
  string method = 7;
  int32 status = 8;
}

message ListPermissionsRequest {
  string tenant_id = 1;
}

message ListPermissionsResponse {
  repeated Permission permissions = 1;
}

// ---------- Casbin 策略 ----------
message Policy {
  int64 id = 1;
  string tenant_id = 2;
  string role_code = 3;
  string perm_code = 4;
  string resource = 5;
  string action = 6;
}

message ListPoliciesRequest {
  string tenant_id = 1;
  string role_code = 2;
}

message ListPoliciesResponse {
  repeated Policy policies = 1;
}

service IamService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Refresh(RefreshRequest) returns (LoginResponse);
  rpc Verify(VerifyRequest) returns (VerifyResponse);

  rpc CreateUser(CreateUserRequest) returns (User);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc DeleteUser(GetUserRequest) returns (Empty);

  rpc CreateRole(CreateRoleRequest) returns (Role);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc DeleteRole(GetRoleRequest) returns (Empty);

  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);

  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc AddPolicy(Policy) returns (Empty);
  rpc RemovePolicy(Policy) returns (Empty);
}

message GetUserRequest {
  int64 id = 1;
  string tenant_id = 2;
}

message GetRoleRequest {
  int64 id = 1;
  string tenant_id = 2;
}

message Empty {}

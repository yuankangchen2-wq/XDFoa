syntax = "proto3";

package crm;
option go_package = "./api/crm";

// 客户
message Customer {
  int64 id = 1;
  string tenant_id = 2;
  string name = 3;
  string contact_person = 4;
  string phone = 5;
  string email = 6;
  string address = 7;
  string level = 8;          // A/B/C/D
  string industry = 9;
  string owner_id = 10;      // 归属销售
  int32 status = 11;         // 1=潜在 2=意向 3=成交 4=流失
  string remark = 12;
  int64 created_at = 13;
  repeated Contact contacts = 14;
  repeated FollowUp follow_ups = 15;
}

// 联系人
message Contact {
  int64 id = 1;
  int64 customer_id = 2;
  string name = 3;
  string position = 4;
  string phone = 5;
  string email = 6;
  int32 is_primary = 7;
}

// 跟进记录
message FollowUp {
  int64 id = 1;
  int64 customer_id = 2;
  string type = 3;           // 电话/拜访/邮件/微信
  string content = 4;
  string user_id = 5;
  int64 follow_up_at = 6;
}

message PageRequest { int32 page = 1; int32 page_size = 2; }
message PageResponse { int64 total = 1; int32 page = 2; int32 page_size = 3; }

message ListCustomerRequest {
  string tenant_id = 1;
  string level = 2;
  int32 status = 3;
  PageRequest page = 4;
}

message ListCustomerResponse {
  repeated Customer customers = 1;
  PageResponse page = 2;
}

message Empty {}

service CrmCustomerService {
  rpc CreateCustomer(Customer) returns (Customer);
  rpc ListCustomers(ListCustomerRequest) returns (ListCustomerResponse);
  rpc GetCustomer(Customer) returns (Customer);
  rpc UpdateCustomer(Customer) returns (Empty);
  rpc DeleteCustomer(Customer) returns (Empty);
  rpc AddContact(Contact) returns (Contact);
  rpc AddFollowUp(FollowUp) returns (FollowUp);
  rpc ListFollowUps(Customer) returns (FollowUp);
}

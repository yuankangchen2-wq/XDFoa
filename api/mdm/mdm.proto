syntax = "proto3";

package mdm;
option go_package = "./api/mdm";

// ==================== 通用消息 ====================
message PageRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message PageResponse {
  int64 total = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message Empty {}

// ==================== 客户 ====================
message Customer {
  int64 id = 1;
  string tenant_id = 2;
  string customer_code = 3;
  string customer_name = 4;
  string customer_type = 5;  // enterprise / individual
  string industry = 6;
  string region = 7;
  string contact_name = 8;
  string contact_phone = 9;
  string contact_email = 10;
  string address = 11;
  int32 status = 12;  // 1=正常 0=禁用
  int64 created_at = 13;
  int64 updated_at = 14;
}

message CreateCustomerRequest {
  string tenant_id = 1;
  string customer_code = 2;
  string customer_name = 3;
  string customer_type = 4;
  string industry = 5;
  string region = 6;
  string contact_name = 7;
  string contact_phone = 8;
  string contact_email = 9;
  string address = 10;
}

message UpdateCustomerRequest {
  int64 id = 1;
  string tenant_id = 2;
  string customer_name = 3;
  string customer_type = 4;
  string industry = 5;
  string region = 6;
  string contact_name = 7;
  string contact_phone = 8;
  string contact_email = 9;
  string address = 10;
  int32 status = 11;
}

message GetCustomerRequest {
  int64 id = 1;
  string tenant_id = 2;
}

message ListCustomersRequest {
  string tenant_id = 1;
  string keyword = 2;
  string customer_type = 3;
  PageRequest page = 4;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
  PageResponse page = 2;
}

// ==================== 商品 ====================
message Product {
  int64 id = 1;
  string tenant_id = 2;
  string sku_code = 3;
  string product_name = 4;
  string category = 5;
  string unit = 6;
  string spec = 7;
  int32 status = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}

message CreateProductRequest {
  string tenant_id = 1;
  string sku_code = 2;
  string product_name = 3;
  string category = 4;
  string unit = 5;
  string spec = 6;
}

message UpdateProductRequest {
  int64 id = 1;
  string tenant_id = 2;
  string product_name = 3;
  string category = 4;
  string unit = 5;
  string spec = 6;
  int32 status = 7;
}

message GetProductRequest {
  int64 id = 1;
  string tenant_id = 2;
}

message ListProductsRequest {
  string tenant_id = 1;
  string keyword = 2;
  string category = 3;
  PageRequest page = 4;
}

message ListProductsResponse {
  repeated Product products = 1;
  PageResponse page = 2;
}

// ==================== 供应商 ====================
message Supplier {
  int64 id = 1;
  string tenant_id = 2;
  string supplier_code = 3;
  string supplier_name = 4;
  string contact_name = 5;
  string contact_phone = 6;
  string contact_email = 7;
  string address = 8;
  int32 status = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

message CreateSupplierRequest {
  string tenant_id = 1;
  string supplier_code = 2;
  string supplier_name = 3;
  string contact_name = 4;
  string contact_phone = 5;
  string contact_email = 6;
  string address = 7;
}

message UpdateSupplierRequest {
  int64 id = 1;
  string tenant_id = 2;
  string supplier_name = 3;
  string contact_name = 4;
  string contact_phone = 5;
  string contact_email = 6;
  string address = 7;
  int32 status = 8;
}

message GetSupplierRequest {
  int64 id = 1;
  string tenant_id = 2;
}

message ListSuppliersRequest {
  string tenant_id = 1;
  string keyword = 2;
  PageRequest page = 3;
}

message ListSuppliersResponse {
  repeated Supplier suppliers = 1;
  PageResponse page = 2;
}

// ==================== 组织 ====================
message Organization {
  int64 id = 1;
  string tenant_id = 2;
  int64 parent_id = 3;
  string org_code = 4;
  string org_name = 5;
  string org_path = 6;  // /root/division/dept/team
  int32 org_level = 7;
  int32 sort_order = 8;
  int32 status = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

message CreateOrganizationRequest {
  string tenant_id = 1;
  int64 parent_id = 2;
  string org_code = 3;
  string org_name = 4;
  int32 sort_order = 5;
}

message UpdateOrganizationRequest {
  int64 id = 1;
  string tenant_id = 2;
  string org_name = 3;
  int32 sort_order = 4;
  int32 status = 5;
}

message GetOrganizationRequest {
  int64 id = 1;
  string tenant_id = 2;
}

message ListOrganizationsRequest {
  string tenant_id = 1;
  int64 parent_id = 2;
}

message ListOrganizationsResponse {
  repeated Organization organizations = 1;
}

// ==================== 服务定义 ====================
service MdmService {
  // 客户
  rpc CreateCustomer(CreateCustomerRequest) returns (Customer);
  rpc UpdateCustomer(UpdateCustomerRequest) returns (Customer);
  rpc GetCustomer(GetCustomerRequest) returns (Customer);
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
  rpc DeleteCustomer(GetCustomerRequest) returns (Empty);

  // 商品
  rpc CreateProduct(CreateProductRequest) returns (Product);
  rpc UpdateProduct(UpdateProductRequest) returns (Product);
  rpc GetProduct(GetProductRequest) returns (Product);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc DeleteProduct(GetProductRequest) returns (Empty);

  // 供应商
  rpc CreateSupplier(CreateSupplierRequest) returns (Supplier);
  rpc UpdateSupplier(UpdateSupplierRequest) returns (Supplier);
  rpc GetSupplier(GetSupplierRequest) returns (Supplier);
  rpc ListSuppliers(ListSuppliersRequest) returns (ListSuppliersResponse);
  rpc DeleteSupplier(GetSupplierRequest) returns (Empty);

  // 组织
  rpc CreateOrganization(CreateOrganizationRequest) returns (Organization);
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (Organization);
  rpc GetOrganization(GetOrganizationRequest) returns (Organization);
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  rpc DeleteOrganization(GetOrganizationRequest) returns (Empty);
}

syntax = "proto3";

package order;
option go_package = "./api/order";

// 订单
message Order {
  int64 id = 1;
  string tenant_id = 2;
  string order_no = 3;
  int64 user_id = 4;
  int32 status = 5;           // 1=待支付 2=已支付 3=已发货 4=已完成 9=已取消
  double total_amount = 6;
  int64 warehouse_id = 7;
  string remark = 8;
  int64 created_at = 9;
  repeated OrderItem items = 10;
}

message OrderItem {
  int64 id = 1;
  int64 order_id = 2;
  string sku_code = 3;
  int64 quantity = 4;
  double unit_price = 5;
}

// 订单状态日志
message OrderLog {
  int64 id = 1;
  int64 order_id = 2;
  int32 from_status = 3;
  int32 to_status = 4;
  string remark = 5;
  int64 created_at = 6;
}

message PageRequest { int32 page = 1; int32 page_size = 2; }
message PageResponse { int64 total = 1; int32 page = 2; int32 page_size = 3; }

message ListOrdersRequest {
  string tenant_id = 1;
  int64 user_id = 2;
  int32 status = 3;
  PageRequest page = 4;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  PageResponse page = 2;
}

message PayRequest {
  int64 order_id = 1;
  string pay_method = 2;
}

message Empty {}

service OrderService {
  rpc CreateOrder(Order) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetOrder(Order) returns (Order);
  rpc PayOrder(PayRequest) returns (Empty);
  rpc CancelOrder(Order) returns (Empty);
  rpc ShipOrder(Order) returns (Empty);
  rpc CompleteOrder(Order) returns (Empty);
}

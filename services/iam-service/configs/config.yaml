server:
  name: iam-service
  http_port: 8082

database:
  driver: postgres
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: oa_iam
  sslmode: disable

jwt:
  secret: "oa-portal-jwt-secret-change-me"
  access_token_ttl: 900      # 15分钟
  refresh_token_ttl: 604800   # 7天

casbin:
  model_path: configs/casbin_model.conf
